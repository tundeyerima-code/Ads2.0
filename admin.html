<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Staytune Maputo Admin</title>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #edf5ff;
  padding: 20px;
}

.panel {
  max-width: 500px;
  margin: 30px auto;
  padding: 25px;
  background: white;
  border-radius: 15px;
  box-shadow: 0 5px 25px #0002;
}

h1 {
  color: #1877f2;
  text-align: center;
}

p {
  text-align: center;
  color: #666;
}

label {
  display: block;
  margin-top: 22px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 13px;
  margin-top: 10px;
  border: 1px solid #ccc;
  border-radius: 8px;
}

#preview {
  display: none;
  width: 100%;
  max-height: 250px;
  object-fit: contain;
  margin-top: 15px;
  border-radius: 10px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 15px;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  font-size: 15px;
  cursor: pointer;
}

.save {
  background: #1877f2;
  color: white;
}

.delete {
  background: #ffe5e5;
  color: red;
}

.view {
  background: #e5f0ff;
  color: #1877f2;
}

#status {
  margin-top: 18px;
  text-align: center;
  color: #1877f2;
}

</style>
</head>

<body>

<div class="panel">

<h1>STAYTUNE MAPUTO</h1>

<p>Manage your landing page content.</p>

<label>Upload New Image</label>

<input
  type="file"
  id="imageFile"
  accept="image/*"
>

<img id="preview" alt="Image preview">

<label>Insert Destination Link</label>

<input
  type="url"
  id="destination"
  placeholder="https://example.com"
>

<button class="save" onclick="saveContent()">
SAVE / PUBLISH
</button>

<button class="delete" onclick="deleteContent()">
DELETE PREVIOUS IMAGE
</button>

<button class="view"
  onclick="location.href='index.html'">
VIEW LANDING PAGE
</button>

<p id="status"></p>

</div>

<script>

const KEY = "staytuneMaputoContent";

let selectedImage = "";

const fileInput =
document.getElementById("imageFile");

const preview =
document.getElementById("preview");

const destination =
document.getElementById("destination");

const status =
document.getElementById("status");

// Load previous content

try {

  const oldContent = JSON.parse(
    localStorage.getItem(KEY) || "null"
  );

  if(oldContent) {

    selectedImage = oldContent.image || "";

    destination.value = oldContent.url || "";

    if(selectedImage) {

      preview.src = selectedImage;
      preview.style.display = "block";

    }

  }

} catch(e) {}

// Upload image

fileInput.addEventListener("change", function() {

  const file = this.files[0];

  if(!file) return;

  if(!file.type.startsWith("image/")) {

    status.textContent = "Select a valid image.";

    return;

  }

  const reader = new FileReader();

  reader.onload = function() {

    selectedImage = reader.result;

    preview.src = selectedImage;

    preview.style.display = "block";

    status.textContent = "Image ready to publish.";

  };

  reader.readAsDataURL(file);

});

// Save content

function saveContent() {

  const url = destination.value.trim();

  if(!selectedImage) {

    status.textContent = "Please upload an image.";

    return;

  }

  if(!url) {

    status.textContent = "Please enter a destination link.";

    return;

  }

  let parsed;

  try {

    parsed = new URL(url);

  } catch(e) {

    status.textContent = "Enter a valid URL.";

    return;

  }

  if(!["http:", "https:"].includes(parsed.protocol)) {

    status.textContent = "Only HTTP and HTTPS links are allowed.";

    return;

  }

  try {

    localStorage.setItem(
      KEY,
      JSON.stringify({
        image: selectedImage,
        url: parsed.href
      })
    );

    status.textContent =
    "Content saved successfully!";

  } catch(e) {

    status.textContent =
    "Image too large. Try a smaller image.";

  }

}

// Delete content

function deleteContent() {

  localStorage.removeItem(KEY);

  selectedImage = "";

  preview.src = "";

  preview.style.display = "none";

  fileInput.value = "";

  destination.value = "";

  status.textContent =
  "Previous image and link deleted.";

}

</script>

</body>
</html>
