<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #eaf4ff, #ffffff);
  min-height: 100vh;
  text-align: center;
}

header {
  padding: 40px 15px;
}

h1 {
  color: #1877f2;
  font-size: 38px;
  font-weight: 900;
  letter-spacing: 2px;
}

.container {
  width: 92%;
  max-width: 750px;
  margin: 25px auto;
}

.frame {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #102b4d;
  border-radius: 15px;
  overflow: hidden;
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 10px 30px #0003;
}

.frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}

.empty-message {
  color: white;
  font-size: 17px;
}

.play-button {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 80px;
  height: 80px;
  border: none;
  border-radius: 50%;
  background: #1877f2;
  color: white;
  font-size: 38px;
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
  box-shadow: 0 5px 20px #0006;
}

.play-button:hover {
  background: #0866d5;
}

.play-button span {
  margin-left: 6px;
}

.subtitle {
  margin-top: 20px;
  color: #667788;
  font-size: 14px;
}

footer {
  padding: 35px;
  color: #777;
  font-size: 13px;
}

@media(max-width: 500px) {
  h1 {
    font-size: 29px;
  }

  .play-button {
    width: 65px;
    height: 65px;
    font-size: 30px;
  }
}
</style>
</head>

<body>

<header>
  <h1>STAYTUNE MAPUTO</h1>
</header>

<div class="container">

  <div class="frame">

    <img id="mainImage" alt="Staytune Maputo featured image">

    <div class="empty-message" id="emptyMessage">
      Stay tuned. New content coming soon!
    </div>

    <button class="play-button"
      id="playButton"
      aria-label="Play">
      <span>▶</span>
    </button>

  </div>

  <p class="subtitle">
    Click the play button to continue.
  </p>

</div>

<footer>
  © 2026 STAYTUNE MAPUTO
</footer>

<script>

const KEY = "staytuneMaputoContent";

const image = document.getElementById("mainImage");
const empty = document.getElementById("emptyMessage");
const play = document.getElementById("playButton");

function loadContent() {

  let content = null;

  try {
    content = JSON.parse(
      localStorage.getItem(KEY) || "null"
    );
  } catch(e) {}

  if(content && content.image) {

    image.src = content.image;
    image.style.display = "block";
    empty.style.display = "none";

  } else {

    image.style.display = "none";
    empty.style.display = "block";

  }

  play.onclick = function() {

    if(content && content.url) {

      window.open(
        content.url,
        "_blank",
        "noopener,noreferrer"
      );

    } else {

      alert("No destination link available yet.");

    }

  };

}

loadContent();

window.addEventListener("storage", loadContent);

</script>

</body>
</html>
