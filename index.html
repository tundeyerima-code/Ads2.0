<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staytune Maputo</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #eaf4ff, #ffffff);
  text-align: center;
}

header {
  padding: 35px 15px;
}

h1 {
  color: #1877f2;
  font-size: 38px;
  font-weight: bold;
  letter-spacing: 2px;
}

.container {
  width: 90%;
  max-width: 750px;
  margin: 25px auto;
}

.frame {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #102b4d;
  border-radius: 15px;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 10px 30px #0002;
}

.frame img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
}

.play-button {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 78px;
  height: 78px;
  border: none;
  border-radius: 50%;
  background: #1877f2;
  color: white;
  font-size: 35px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 5px 20px #0006;
}

.play-button:hover {
  background: #0866d5;
  transform: translate(-50%, -50%) scale(1.08);
}

.play-button span {
  margin-left: 5px;
}

.empty-message {
  color: white;
  padding: 20px;
}

footer {
  margin-top: 40px;
  color: #777;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  <h1>STAYTUNE MAPUTO</h1>
</header>

<div class="container">

  <div class="frame">

    <img id="mainImage" alt="Featured image">

    <div class="empty-message" id="emptyMessage">
      Stay tuned. New content coming soon!
    </div>

    <button class="play-button"
      id="playButton"
      aria-label="Play">
      <span>▶</span>
    </button>

  </div>

</div>

<footer>
  © 2026 Staytune Maputo
</footer>

<script>
const STORAGE_KEY = "staytuneMaputoContent";

const image = document.getElementById("mainImage");
const empty = document.getElementById("emptyMessage");
const play = document.getElementById("playButton");

function loadContent() {

  const content = JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "null"
  );

  if (content && content.image) {
    image.src = content.image;
    image.style.display = "block";
    empty.style.display = "none";
  } else {
    image.style.display = "none";
    empty.style.display = "block";
  }

  play.onclick = function() {
    if (content && content.url) {
      window.open(content.url, "_blank");
    } else {
      alert("No link has been added yet.");
    }
  };
}

loadContent();

window.addEventListener("storage", loadContent);
</script>

</body>
</html>
